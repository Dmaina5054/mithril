# /home/dm/Projects/learn/golang/mithril/observability/docker-compose.yml
# Services on the default bridge network — custom networks had a NAT gap
# on this kernel (Docker 29.6.2, Debian 13, iptables backend).
# Default bridge resolves service names identically and works.

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"  # localhost only — NOT Tailscale-exposed
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alerts/:/etc/prometheus/alerts/:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux Docker Engine doesn't resolve this by default
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      - "--web.enable-lifecycle"  # hot reload via curl /-/reload
      - "--web.listen-address=0.0.0.0:9090"

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "0.0.0.0:3001:3000"  # Tailscale-accessible — 3000 taken by Hermes WhatsApp bridge
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=daniel
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=http://minas-tirith.tail-xxxx.ts.net:3001
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY}
    depends_on: [prometheus]

volumes:
  prometheus_data:
    name: prometheus_data
  grafana_data:
    name: grafana_data
